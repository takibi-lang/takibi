<h1>Takibi Kernel</h1>
<p><img src="/icon.png" alt="Takibi logo" width="96" height="96"></p>
<p>This page is served by Alpine BusyBox httpd running as an AArch64 userspace process on the Takibi kernel.</p>
<p>The same ext2 root filesystem is read through virtio-blk on QEMU and USB mass storage on Raspberry Pi 5, then sent through Takibi's TCP/IP stack.</p>
