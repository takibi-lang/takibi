name: CI

# The hardware-free half of `make allcheck`, which is what a hosted runner can
# run: langcheck, slowcheck, the compiler unit tests, linux_user, the TLA+
# models, and the QEMU lanes. `make cicheck` is that set, derived from the same variable allcheck
# uses so the two cannot drift apart.
#
# It runs as parallel jobs, one per part of cicheck (GitHub issue #816):
# `make cicheck-lang`, `cicheck-models`, `cicheck-qemu` and `cicheck-race`
# (the race-window QEMU lanes), whose union is cicheck. On one runner the serial set reached the 90-minute limit on
# 2026-10-17: the QEMU lanes take about 47 minutes on their own, and the TLA+
# models grew from 5 to roughly 15 minutes of a four-core runner (protocol
# trace TLC windows #606, WorldStopRetry liveness #641, litmus #645, LogRing
# #613). scripts/check_ci_parts.py keeps the matrix and the Makefile parts in
# step, and scripts/ci_time_budget.py fails a part that used more than
# three quarters of its limit, so growth is reported while it still passes.
#
# The RPi5 lane is absent deliberately, not by oversight. A
# GitHub-hosted runner has no board. A self-hosted runner on the machine that
# does have them would queue behind a workstation that is switched off
# overnight and would then take the board at whatever moment it came back --
# which is when a person is about to use it. Measured 2026-09-06: the RPi5
# lane runs alone for 28.8 s of allcheck's 70.6 s span, and its intermittents
# have been measured at rates (2 in 4, 1 in 5 before their fixes) that make a
# single automated run a poor verdict anyway. Hardware stays a thing a person
# runs at a natural boundary of the work.
#
# Every phase is timed. This workflow is a first iteration whose costs are not
# yet known, so it reports where its own minutes went rather than asking
# someone to guess: the make phases go through scripts/run_lane.sh, the same
# receipt the local aggregates use, and the step durations GitHub records are
# summarised beside them.

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: read
  # GitHub issue #565's gate asks whether every row of
  # docs/KNOWN_INTERMITTENTS.md still names an OPEN issue. Without this the
  # job's token cannot see issues, and `gh issue list` answers with EXIT 0
  # AND EMPTY OUTPUT rather than an error -- which is why the check now
  # treats an unreadable answer as "could not ask" instead of trusting the
  # exit status.
  issues: read

# On main every commit runs to completion, so each one keeps its own verdict
# and a break can be pinned to the commit that caused it. Elsewhere a batch of
# pushes should not queue a run per commit; the newest is the one whose answer
# anybody wants.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  hardware-free:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [lang, models, qemu, race]
    # A hosted runner allows 6 hours; this cap only catches a hung lane. It
    # was 45 until 2026-10-02, when a green run already took 38m44s and every
    # longer one on main was cut off at 45m0s with no verdict at all.
    timeout-minutes: 90
    env:
      OPAMYES: "true"
      # The workflow's own phases. `make cicheck` empties and fills
      # _build/lane-timing for its lanes, so the two summaries stay separate:
      # this one is setup versus build versus test, that one is which lane.
      TAKIBI_LANE_TIMING_DIR: ${{ github.workspace }}/_build/ci-timing

    steps:
      - name: Job start
        run: echo "CI_JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      # The phase summary's pre-lane line counts from the job's start, not
      # from its first recorded phase (GitHub issue #820). Written after
      # checkout, which empties the workspace.
      - name: Phase timing origin
        run: bash scripts/lane_timing.sh origin "$CI_JOB_START"

      - name: Toolchain packages
        run: |
          bash scripts/run_lane.sh ci-apt bash -euo pipefail -c '
            wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
            chmod +x /tmp/llvm.sh
            sudo /tmp/llvm.sh 19
            # ipxe-qemu carries efi-virtio.rom. It arrives as a Recommends
            # of qemu-system-arm, which --no-install-recommends drops, and
            # without it a lane using a virtio PCI device dies at
            # `failed to find romfile "efi-virtio.rom"` before the guest
            # runs at all. qemu-user carries qemu-aarch64, the host oracle
            # of scripts/ext2_eq.py and scripts/busybox_reference.sh (#1131).
            sudo apt-get install -y --no-install-recommends \
              llvm-19 llvm-19-dev lld-19 libzstd-dev cmake \
              qemu-system-arm qemu-user ipxe-qemu gdb-multiarch \
              mtools cpio e2fsprogs e2tools python3-serial
          '

      # Caches the opam switch itself, which is the expensive part: the OCaml
      # LLVM bindings are compiled, not downloaded. Deliberately an action
      # with a dependency-keyed cache rather than a prebuilt image -- an image
      # drifts from this file silently, a cache key does not.
      # GitHub issue #601: the TLA+ models' lane (make modelcheck). Java 21
      # is what Apalache 0.62 needs. The tools themselves are pinned and
      # sha256-checked by scripts/fetch_model_tools.sh; the cache only
      # saves downloading Apalache's ~190 MB on every run, and is keyed on
      # that script so a version bump fetches afresh.
      # Each part sets up only the tools its lanes use (#816 follow-up):
      # scripts/check_ci_parts.py derives which parts those are from the
      # Makefile's part lists and refuses a tool step whose `if:` admits
      # any other part. Java and the model tools serve modelcheck and every
      # QEMU part (scripts/run_kernel_qemutest.sh replays the boot's
      # protocol trace under TLC, #606); the lang part uses neither.
      - name: Java (TLC and Apalache)
        if: matrix.part != 'lang'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Model tools cache
        if: matrix.part != 'lang'
        uses: actions/cache@v4
        with:
          path: /home/runner/model-tools
          key: model-tools-${{ hashFiles('scripts/fetch_model_tools.sh') }}

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.4.0"

      - name: OCaml dependencies
        run: |
          bash scripts/run_lane.sh ci-opam bash -euo pipefail -c '
            # dune-project is the dependency source; Dune generates takibi.opam.
            opam install -y --deps-only --with-test .
          '

      # GitHub issue #645: herd7 for the litmus tests in make modelcheck
      # (part of cicheck). Built once by scripts/build_herd7.sh, outside the
      # repository and the job's opam switch, and cached. `opam install
      # herdtools7` in this job failed -- opam builds in
      # _opam/.opam-switch/build/ and herdtools7's dune walked up to takibi's
      # dune-project -- and would rebuild it and its dependencies every run.
      # Its own cache rather than a subtree of model-tools: that key hashes
      # fetch_model_tools.sh, so a herd7 bump would refetch Apalache and the
      # reverse. The key hashes the script, which holds the version pin;
      # scripts/check_herdtools_pin.py checks that pin against the
      # devcontainer's and keeps the build behind the cache-hit guard.
      # Only the models part runs litmuscheck. Restored and built there
      # alone: on the first run after this cache landed every part missed
      # and built it (seven minutes each, run 39108650565).
      - id: herd7-cache
        name: herd7 cache
        if: matrix.part == 'models'
        uses: actions/cache@v4
        with:
          path: /home/runner/herd7
          key: herd7-${{ hashFiles('scripts/build_herd7.sh') }}

      - name: Build herd7 (cache miss only)
        if: steps.herd7-cache.outputs.cache-hit != 'true' && matrix.part == 'models'
        run: bash scripts/run_lane.sh ci-herd7 bash scripts/build_herd7.sh /home/runner/herd7

      # The QEMU parts' kernel images on every core, before the
      # one-lane-at-a-time run below (#816 follow-up). Run 39108650565 spent
      # 17 minutes building them at -j1 ahead of its first lane; nothing
      # boots a guest here, so the starvation the comment below describes
      # cannot happen. The checks then find them up to date. The buildchecks
      # stay in the checks step (make kernelbuild-check's own recipe).
      - name: Kernel images on every core (QEMU parts)
        if: matrix.part == 'qemu' || matrix.part == 'race'
        run: |
          eval $(opam env)
          bash scripts/run_lane.sh ci-kernel-images make kernelbuild-images

      # One lane at a time. Every QEMU lane runs `-smp $TAKIBI_QEMU_SMP` (4 by
      # default since #719; set it to 2 here if the debug lane stalls again --
      # the QEMU runner derives the smp_bringup view from it), so N lanes ask
      # for 4N guest vCPUs, and GitHub issue #509 measured what starving them
      # does: the guest stops mid-boot, always at `linux socket: listener
      # ready port=8080`, reported as an interactive-HTTPd lifecycle stall,
      # which names the wrong thing.
      #
      # Half the cores was tried first and was not enough. Four vCPUs on four
      # cores leaves nothing for QEMU's own I/O threads, the Python drivers,
      # or the runner agent, and the debug lane -- the biggest kernel, built
      # with -g -- still stopped at that line. `taskset -c 0-3` reproduces the
      # core count locally but not the per-core speed of a hosted runner, so
      # the measurement that passed here did not transfer.
      #
      # Serial lanes cost minutes rather than the 41 s a 24-core host takes,
      # and buy a verdict about the change rather than about the runner.
      - name: Hardware-free checks
        run: |
          eval $(opam env)
          echo "running with TAKIBI_JOBS=1 on $(nproc) cores"
          # A four-core runner boots the guest slowly enough that the default
          # 90s budget is a real constraint rather than a wide margin, and a
          # guest cut off mid-boot reports as a lifecycle stall, which names
          # the wrong thing. Widened here rather than everywhere: on a
          # development host 90s is already several times what a boot takes.
          # Boot performance is calibrated separately from the capture budget:
          # hosted 35s, local 25s. The validator documents the measurements.
          TAKIBI_JOBS=1 KERNEL_QEMU_TIMEOUT=240 KERNEL_QEMU_CEILING=720 KERNEL_QEMU_TIMING_PROFILE=hosted make cicheck-${{ matrix.part }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAKIBI_MODEL_TOOLS_DIR: /home/runner/model-tools
          HERD7: /home/runner/herd7/bin/herd7

      # Printed, never gated. The unsafe-block and assembly counts are
      # supposed to be moving right now -- multicore work adds atomics -- so a
      # threshold or a recorded baseline would measure churn rather than risk,
      # and would conflict constantly between two agents working in parallel.
      # CI logs are retained, so running it here is what "recording changes
      # over time" costs nothing to mean today.
      - name: Trusted-base inventory
        if: matrix.part == 'lang'
        run: |
          eval $(opam env)
          make trustedbasecheck

      # Keep the UART and DDB evidence together with the exact ELFs whose
      # addresses it contains. Runner-local failure archives otherwise vanish.
      # Also on cancellation (#816): a part cut off at timeout-minutes is
      # cancelled, not failed, and its lane timing is what says why.
      - name: Preserve failure evidence
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-failure-evidence-${{ matrix.part }}
          retention-days: 14
          path: |
            _build/kernel-*/**/*.log
            _build/kernel-*/**/*.actual
            _build/lane-timing/
            _build/ci-timing/
            kernel/build/qemu/*.elf
            kernel/build/rpi5/user_payload.elf

      # GitHub issue #816: a part past three quarters of its limit fails
      # here, while it still finishes, instead of being cancelled later with
      # no verdict and no timing.
      - name: CI time budget
        run: python3 scripts/ci_time_budget.py "$CI_JOB_START" _build/lane-timing

      - name: Where the time went
        if: always()
        run: |
          {
            echo "## Phase timing"
            echo '```'
            python3 scripts/summarize_lane_timing.py "$TAKIBI_LANE_TIMING_DIR" \
              2>&1 || true
            echo '```'
            echo "## Lane timing inside cicheck"
            echo '```'
            python3 scripts/summarize_lane_timing.py _build/lane-timing \
              2>&1 || true
            echo '```'
            echo "## Step durations recorded by GitHub"
            echo '```'
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
              --jq '.jobs[] | select(.name == "hardware-free (${{ matrix.part }})") | .steps[]
                    | "\(.conclusion // "running")\t\(.name)"' 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}
